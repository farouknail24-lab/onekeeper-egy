<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneKeeper Egypt | Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --border-color: #262626;
            --accent: #00ff66;
            --accent-hover: #00cc52;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        html[dir="rtl"] * { font-family: 'Cairo', sans-serif !important; }
        
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        
        header { background: rgba(11, 11, 11, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1300px; margin: 0 auto; padding: 20px 40px; }
        
        .logo { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 1.5px; text-transform: uppercase; }
        .logo span { color: var(--accent); }
        
        .nav-right { display: flex; align-items: center; gap: 25px; }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        
        .lang-switch { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .lang-switch:hover { border-color: var(--accent); color: var(--accent); }

        .hero { height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=1920&q=80') center/cover; padding: 0 20px; border-bottom: 1px solid var(--border-color); }
        .hero h1 { font-size: 52px; font-weight: 900; margin-bottom: 15px; letter-spacing: 2px; text-transform: uppercase; }
        .hero p { font-size: 16px; color: #bbb; max-width: 650px; margin-bottom: 35px; font-weight: 500; }
        
        .btn { background: var(--accent); color: #000; padding: 14px 32px; font-weight: 800; text-decoration: none; border-radius: 6px; border: none; cursor: pointer; transition: 0.3s; display: inline-block; text-align: center; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
        
        .btn-whatsapp { background: #25d366; color: #fff; width: 100%; padding: 12px; font-size: 13px; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; border-radius: 6px; text-decoration: none; font-weight: 700; }
        .btn-whatsapp:hover { background: #1ebe57; }
        
        .btn-online { background: #1a1a1a; color: #fff; border: 1px solid var(--border-color); width: 100%; padding: 10px; font-size: 12px; margin-top: 6px; border-radius: 6px; text-decoration: none; display: block; text-align: center; font-weight: 600; }
        .btn-online:hover { border-color: var(--text-main); }

        .container { max-width: 1300px; margin: 60px auto; padding: 0 40px; }
        .section-title { font-size: 24px; font-weight: 800; margin-bottom: 40px; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 15px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        
        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); transition: 0.3s; position: relative; text-align: left; }
        html[dir="rtl"] .product-card { text-align: right; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 10px 30px rgba(0,255,102,0.05); }
        
        .product-img-container { position: relative; height: 280px; background: #111; overflow: hidden; }
        .product-img { width: 100%; height: 100%; background-size: cover; background-position: center; display: none; transition: transform 0.5s ease; }
        .product-img.active { display: block; }
        
        .img-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7); color: #fff; border: none; width: 32px; height: 32px; cursor: pointer; font-weight: bold; border-radius: 50%; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .img-nav-btn:hover { background: var(--accent); color: #000; }
        .img-prev { left: 10px; }
        html[dir="rtl"] .img-prev { left: auto; right: 10px; }
        .img-next { right: 10px; }
        html[dir="rtl"] .img-next { right: auto; left: 10px; }

        .discount-badge { position: absolute; top: 12px; right: 12px; background: #ff3333; color: #fff; padding: 5px 10px; font-size: 11px; font-weight: 800; border-radius: 4px; z-index: 10; }
        html[dir="rtl"] .discount-badge { right: auto; left: 12px; }

        .product-info { padding: 22px; }
        .product-cat { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
        .product-name { font-size: 17px; font-weight: 700; margin-bottom: 12px; color: #fff; }
        
        .product-price-box { margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
        html[dir="rtl"] .product-price-box { flex-direction: row-reverse; justify-content: flex-end; }
        .product-price { font-size: 16px; font-weight: 900; color: var(--accent); }
        .product-old-price { font-size: 13px; color: var(--text-muted); text-decoration: line-through; }

        /* Admin Panel */
        #admin-panel { display: none; background: #121212; border: 2px dashed var(--accent); padding: 35px; margin-bottom: 50px; border-radius: 12px; text-align: left; }
        html[dir="rtl"] #admin-panel { text-align: right; }
        #admin-panel h2 { margin-bottom: 25px; color: var(--accent); font-size: 20px; font-weight: 800; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 8px; color: #bbb; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #1c1c1c; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input[type="file"] { padding: 9px; cursor: pointer; color: var(--accent); }
        
        .btn-delete-prod { width: 100%; padding: 8px; font-size: 11px; background: rgba(255,51,51,0.1); color: #ff4444; border: 1px solid rgba(255,51,51,0.2); border-radius: 6px; margin-top: 8px; cursor: pointer; font-weight: 700; }
        .json-box { margin-top: 20px; background: #0a0a0a; padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); }
        .json-box textarea { width: 100%; height: 100px; background: #111; color: var(--accent); border: none; padding: 10px; font-family: monospace; font-size: 12px; resize: none; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">ONE<span>KEEPER</span></div>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="#" data-en="GLOVES" data-ar="القفازات">GLOVES</a></li>
                    <li><a href="#" data-en="EQUIPMENT" data-ar="المعدات">EQUIPMENT</a></li>
                    <li><a href="#" data-en="CLOTHING" data-ar="الملابس">CLOTHING</a></li>
                </ul>
                <button class="lang-switch" onclick="toggleLanguage()" id="lang-btn">العربية 🇸🇦</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1 id="hero-title">MASTER YOUR GOAL</h1>
        <p id="hero-desc">Professional goalkeeper gloves engineered with ultimate grip, precision comfort, and advanced German latex technology.</p>
        <a href="#shop" class="btn" id="hero-btn">SHOP COLLECTION</a>
    </section>

    <div class="container" id="shop">
        
        <div id="admin-panel">
            <h2 id="admin-title">⚙️ Admin Control Panel (Local Images Generator)</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="p-name" placeholder="e.g. OneKeeper Hybrid Pro">
                </div>
                <div class="form-group">
                    <label>Base Price (Before Discount)</label>
                    <input type="text" id="p-old-price" placeholder="e.g. EGP 4,200">
                </div>
                <div class="form-group">
                    <label>Current Price</label>
                    <input type="text" id="p-price" placeholder="e.g. EGP 3,500">
                </div>
                <div class="form-group">
                    <label>Discount Tag</label>
                    <input type="text" id="p-discount" placeholder="e.g. 15% OFF">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="p-cat">
                        <option value="GLOVES">Gloves</option>
                        <option value="EQUIPMENT">Equipment</option>
                        <option value="CLOTHING">Clothing</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Select Multiple Images From Your Device</label>
                    <input type="file" id="p-files" accept="image/*" multiple>
                </div>
            </div>
            <button class="btn" onclick="addNewProductToJSON()">Add Product & Generate JSON</button>

            <div class="json-box">
                <label style="color: var(--accent); font-size: 12px; margin-bottom: 5px; display: block;" id="copy-label">📋 Copy this code and update 'products.json' on GitHub:</label>
                <textarea id="json-output" readonly></textarea>
            </div>
        </div>

        <div class="section-title" id="sec-title">FEATURED PRODUCTS</div>
        <div class="products-grid" id="products-container"></div>
    </div>

    <script>
        let currentLang = localStorage.getItem('onekeeper_lang') || 'en';
        let allProducts = [];
        let uploadedImagesBase64 = [];
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'farouk';

        const translations = {
            en: {
                langBtn: "العربية 🇸🇦",
                heroTitle: "MASTER YOUR GOAL",
                heroDesc: "Professional goalkeeper gloves engineered with ultimate grip, precision comfort, and advanced German latex technology.",
                heroBtn: "SHOP COLLECTION",
                secTitle: "FEATURED PRODUCTS",
                adminTitle: "⚙️ Admin Control Panel (Local Images Generator)",
                waBtn: "💬 Order via WhatsApp",
                onlineBtn: "💳 Online Payment (InstaPay / Visa)",
                delBtn: "Delete Product",
                deleteConfirm: "Are you sure you want to delete this product?",
                copyLabel: "📋 Copy this code and update 'products.json' on GitHub:"
            },
            ar: {
                langBtn: "English 🇬🇧",
                heroTitle: "سيطر على مرماك",
                heroDesc: "قفازات حراس مرمى احترافية مصممة بأعلى مستوى ثبات، راحة فائقة، وبتكنولوجيا اللاتكس الألمانية المتقدمة.",
                heroBtn: "تسوق المجموعة",
                secTitle: "المنتجات المميزة",
                adminTitle: "⚙️ لوحة تحكم المدير (رفع الصور من الجهاز)",
                waBtn: "💬 اطلب عبر الواتساب",
                onlineBtn: "💳 دفع أونلاين (إنستاباي / فيزا)",
                delBtn: "حذف المنتج",
                deleteConfirm: "هل أنت متأكد من حذف هذا المنتج؟",
                copyLabel: "📋 انخخ هذا الكود وقم بتحديث ملف 'products.json' على جيت هب:"
            }
        };

        // معالجة اختيار الصور من الجهاز وتحويلها لكود مصغر
        document.getElementById('p-files').addEventListener('change', function(e) {
            const files = e.target.files;
            uploadedImagesBase64 = [];
            if (files.length === 0) return;

            let processedCount = 0;
            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    // تصغير مقاس الصورة تلقائياً لضمان خفة حجم ملف الجايسون
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        const max_size = 600;
                        if (width > height) {
                            if (width > max_size) { height *= max_size / width; width = max_size; }
                        } else {
                            if (height > max_size) { width *= max_size / height; height = max_size; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        uploadedImagesBase64.push(canvas.toDataURL('image/jpeg', 0.8));
                        processedCount++;
                        if(processedCount === files.length) {
                            alert('تم تجهيز الصور بنجاح! املأ باقي بيانات المنتج واضغط إضافة.');
                        }
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(files[i]);
            }
        });

        async function loadProducts() {
            try {
                const response = await fetch('products.json?' + new Date().getTime());
                allProducts = await response.json();
            } catch (e) {
                allProducts = [
                    { 
                        name: "OneKeeper Aqua Hybrid", 
                        price: "EGP 3,850", 
                        oldPrice: "EGP 4,500",
                        discount: "15% OFF",
                        cat: "GLOVES", 
                        imgs: ["https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?auto=format&fit=crop&w=600&q=80"] 
                    }
                ];
            }
            renderProducts();
            updateJsonOutput();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            localStorage.setItem('onekeeper_lang', currentLang);
            applyLanguage();
            renderProducts();
        }

        function applyLanguage() {
            const t = translations[currentLang];
            const htmlRoot = document.getElementById('html-root');
            
            if (currentLang === 'ar') {
                htmlRoot.setAttribute('dir', 'rtl');
                htmlRoot.setAttribute('lang', 'ar');
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
                htmlRoot.setAttribute('lang', 'en');
            }

            document.getElementById('lang-btn').innerText = t.langBtn;
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-desc').innerText = t.heroDesc;
            document.getElementById('hero-btn').innerText = t.heroBtn;
            document.getElementById('sec-title').innerText = t.secTitle;
            document.getElementById('copy-label').innerText = t.copyLabel;
            
            if(isAdmin) {
                document.getElementById('admin-title').innerText = t.adminTitle;
            }

            document.querySelectorAll('.nav-links a').forEach(a => {
                a.innerText = a.getAttribute(`data-${currentLang}`);
            });
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            const t = translations[currentLang];
            container.innerHTML = '';

            allProducts.forEach((p, pIndex) => {
                const waMessage = encodeURIComponent(`مرحباً فاروق، أريد طلب هذا المنتج:\n- الاسم: ${p.name}\n- السعر: ${p.price}\n- القسم: ${p.cat}`);
                const waLink = `https://wa.me/201069941223?text=${waMessage}`;

                let imagesHtml = '';
                let navBtnsHtml = '';
                
                if (p.imgs && p.imgs.length > 0) {
                    p.imgs.forEach((imgUrl, i) => {
                        imagesHtml += `<div class="product-img ${i === 0 ? 'active' : ''}" style="background-image: url('${imgUrl}')"></div>`;
                    });
                    
                    if (p.imgs.length > 1) {
                        navBtnsHtml = `
                            <button class="img-nav-btn img-prev" onclick="changeImage(${pIndex}, -1)">❮</button>
                            <button class="img-nav-btn img-next" onclick="changeImage(${pIndex}, 1)">❯</button>
                        `;
                    }
                }

                let discountHtml = p.discount ? `<div class="discount-badge">${p.discount}</div>` : '';
                let oldPriceHtml = p.oldPrice ? `<span class="product-old-price">${p.oldPrice}</span>` : '';
                let adminDeleteBtn = isAdmin ? `<button class="btn-delete-prod" onclick="deleteProduct(${pIndex})">${t.delBtn}</button>` : '';

                container.innerHTML += `
                    <div class="product-card" id="card-${pIndex}">
                        ${discountHtml}
                        <div class="product-img-container">
                            ${imagesHtml}
                            ${navBtnsHtml}
                        </div>
                        <div class="product-info">
                            <div class="product-cat">${p.cat}</div>
                            <div class="product-name">${p.name}</div>
                            <div class="product-price-box">
                                <span class="product-price">${p.price}</span>
                                ${oldPriceHtml}
                            </div>
                            <a href="${waLink}" target="_blank" class="btn btn-whatsapp">${t.waBtn}</a>
                            <a href="https://instapay.eg" target="_blank" class="btn btn-online">${t.onlineBtn}</a>
                            ${adminDeleteBtn}
                        </div>
                    </div>
                `;
            });
        }

        function changeImage(productIndex, direction) {
            const card = document.getElementById(`card-${productIndex}`);
            const imgs = card.querySelectorAll('.product-img');
            let activeIndex = 0;

            imgs.forEach((img, i) => {
                if (img.classList.contains('active')) {
                    activeIndex = i;
                    img.classList.remove('active');
                }
            });

            let newIndex = activeIndex + direction;
            if (newIndex >= imgs.length) newIndex = 0;
            if (newIndex < 0) newIndex = imgs.length - 1;

            imgs[newIndex].classList.add('active');
        }

        function addNewProductToJSON() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const oldPrice = document.getElementById('p-old-price').value;
            const discount = document.getElementById('p-discount').value;
            const cat = document.getElementById('p-cat').value;

            if(!name || !price) {
                alert('Please enter product name and current price!');
                return;
            }

            const imgs = uploadedImagesBase64.length > 0 ? uploadedImagesBase64 : ['https://images.unsplash.com/photo-1543326727-cf6c39e8f84c?auto=format&fit=crop&w=600&q=80'];

            allProducts.push({ name, price, oldPrice, discount, cat, imgs });
            renderProducts();
            updateJsonOutput();
            alert('Product added successfully! Copy the JSON code below and update your products.json file on GitHub.');
            
            // إعادة ضبط حقل الصور
            uploadedImagesBase64 = [];
            document.getElementById('p-files').value = '';
        }

        function deleteProduct(index) {
            if(confirm(translations[currentLang].deleteConfirm)) {
                allProducts.splice(index, 1);
                renderProducts();
                updateJsonOutput();
            }
        }

        function updateJsonOutput() {
            document.getElementById('json-output').value = JSON.stringify(allProducts, null, 2);
        }

        if (isAdmin) {
            document.getElementById('admin-panel').style.display = 'block';
        }

        applyLanguage();
        loadProducts();
    </script>
</body>
</html>
